
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O problema é meu ou seu?</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* APARÊNCIA DA PÁGINA */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(to bottom, #FF3CAC, #2BE7FF);
            color: #fff;
            font-family: 'Montserrat', sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #tela {
            width: 100%;
            max-width: 850px;
            padding: 30px;
        }

        h1 {
            font-size: clamp(1.2rem, 3vw, 2rem);
            margin-bottom: 40px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(#f565ca, #c926d8af) padding-box,
                linear-gradient(to bottom, #f8f8f859, #fffeff56) border-box;
    color: #f7f2f6;
    border: 3px solid transparent;
    border-radius: 8px;
    padding: 15px 35px;
    font-size: 1.2rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
        }

        button:hover {
            background-color: #0fd4f7;
            color: #fff;
        }

        .final {
            font-size: clamp(2.5rem, 8vw, 6rem);
            line-height: 1.15;
            white-space: nowrap;
            display: inline-block;
            animation: letreiro 6s linear infinite;
        }

        @keyframes letreiro {
            from {
                transform: translatex(100vw);
            }

            to {
                transform: translatex(-100vw);
            }
        }

        .reiniciar {
            margin-top: 35px;
            background-color: #fcb903;
            color: #f8f7f7;
            border-color: #f8f6f6;
            font-size: 0.9rem;
        }

        .imagem-final {
            display: block;
            width: auto;
            height: auto;
            max-width: 350px;
            max-height: 45vh;
            object-fit: contain;
            margin: 20px auto;
            border-radius: 12px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 15px;
            border: 3px solid #fdfdfd;
            border-radius: 10px;
            pointer-events: none;
            z-index: 9999;
        }

        /* Ajustes exclusivos da tela final */
#tela:has(.final) {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    overflow: hidden;
    padding: 30px 0;
}

#tela:has(.final) .final {
    position: relative;
    left: 0;
    margin: 20px 0;
}

#tela:has(.final) .imagem-final {
    max-width: calc(100vw - 60px);
}

#tela:has(.final) .reiniciar {
    position: relative;
    z-index: 10000;
}

@media (max-width: 600px) {
    #tela:has(.final) {
        padding: 20px 0;
    }

    #tela:has(.final) .imagem-final {
        max-width: calc(100vw - 40px);
    }
}

.formulario-reclamacao {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
}

.campo-nome {
    display: flex;
    gap: 10px;
    align-items: stretch;
}

.campo-nome input {
    flex: 1;
    min-width: 0;
    width: 100%;
    padding: 14px;
    border: 2px solid white;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
}

.botao-anonimo {
    padding: 10px 14px;
    font-size: 0.85rem;
    white-space: normal;
}

@media (max-width: 600px) {
    .campo-nome {
        flex-direction: column;
    }
}

.formulario-reclamacao label {
    text-align: left;
    font-weight: 700;
}

.formulario-reclamacao select,
.formulario-reclamacao textarea {
    width: 100%;
    padding: 14px;
    border: 2px solid white;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 1rem;
}

.formulario-reclamacao textarea {
    min-height: 150px;
    resize: vertical;
}

/* BOTÃO EXCLUSIVO DE RECLAMAÇÃO */
.botao-reclamacao {
    background: linear-gradient(135deg, #ff3333, #8b0000);
    color: white;
    border: 2px solid white;
    border-radius: 8px;
    padding: 15px 35px;
    font-family: 'Montserrat', sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    transition: 0.3s;
}

.botao-reclamacao:hover {
    background: linear-gradient(135deg, #ff6666, #cc0000);
    transform: scale(1.05);
}

/* TRANSIÇÃO ENTRE TELAS */
#tela > *:not(.final) {
    animation: aparecer 0.4s ease both;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    </style>
</head>

<body>

    <main id="tela"></main>

    <script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxSG4kJDeafRHc3VwMnkSXEGrw7DBWse3olM4ofTl7I5-8ZkJxpEWR1G_qmOfDq0q9c/exec";

// MAPA DE SONS DOS BOTÕES
const sonsDosBotoes = {
    "Preciso de ajuda! 🧡": "mp3/ajuda.mp3",
    "Enviar carinho 🤍": "mp3/carinho.mp3",
    "Fazer reclamação 😡": "mp3/reclamacao.mp3"
};

// TOCAR O SOM DO BOTÃO CLICADO
function tocarSom(textoDoBotao) {
    const arquivo = sonsDosBotoes[textoDoBotao];

    if (!arquivo) {
        return;
    }

    const som = new Audio(arquivo);
    som.play();
}

        // NOSSA PRIMEIRA TELA
        function mostrarPergunta(texto, opcoes) {
            const tela = document.getElementById("tela");

            tela.innerHTML = `
                <h1>${texto}</h1>
                <div class="botoes">
                    ${opcoes.map(opcao => `
                        <button onclick="${opcao.acao}">
                            ${opcao.texto}
                        </button>
                    `).join("")}
                </div>
            `;
        }

        // MOSTRA UMA MENSAGEM FINAL
        function mostrarFinal(mensagem) {
            const tela = document.getElementById("tela");

            let imagem = "";

            if (mensagem === "Então me manda um pix: 15134150699") {
                imagem = '<img src="imagens/lorran.png" alt="Imagem do Pix" class="imagem-final">';
            }

            tela.innerHTML = `
                <h1 class="final">${mensagem}</h1>
                ${imagem}
                <br>
                <button class="reiniciar" onclick="telaInicial()">
                    COMEÇAR DE NOVO
                </button>
            `;
        }

        // PERGUNTA INICIAL
        function inicio() {
            mostrarPergunta(
                "O problema é meu, ou é SEU?",
                [
                    { texto: "1 - Seu", acao: "problemaMeu()" },
                    { texto: "2 - Meu", acao: "problemaSeu()" },
                    { texto: "3 - Não Existe problema", acao: "problemaNaoExiste()" }
                ]
            );
        }

        // CAMINHO: O PROBLEMA É MEU
        function problemaMeu() {
            mostrarPergunta("Posso Resolver?", [
                { texto: "SIM", acao: "mostrarFinal('ENTÃO VOU RESOLVER')" },
                { texto: "NÃO", acao: "mostrarFinal('ENTÃO NÃO LIGO')" }
            ]);
        }

        // CAMINHO: O PROBLEMA É SEU
        function problemaSeu() {
            mostrarPergunta("Eu gosto de você?", [
                { texto: "SIM", acao: "possoResolver()" },
                { texto: "NÃO", acao: "mostrarFinal('ENTÃO NÃO LIGO')" }
            ]);
        }

        // CAMINHO: NÃO EXISTE PROBLEMA
        function problemaNaoExiste() {
            mostrarPergunta("Você só é curioso(a)", [
                { texto: "SIM", acao: "mostrarFinal('Então me manda um pix: 15134150699')" },
            ]);
        }
        

        // SEGUNDA PERGUNTA DO CAMINHO "SEU"
        function possoResolver() {
            mostrarPergunta("Eu posso resolver?", [
                { texto: "SIM", acao: "mostrarFinal('ENTÃO VOU TE AJUDAR')" },
                { texto: "NÃO", acao: "mostrarFinal('ENTÃO NÃO LIGO')" }
            ]);
        }

        function telaReclamacao() {
    const tela = document.getElementById("tela");

    tela.innerHTML = `
        <h1>Central de Reclamações</h1>

        <form class="formulario-reclamacao"
              onsubmit="enviarReclamacao(event)">

              <label for="nomeReclamacao">Seu nome</label>

<div class="campo-nome">
    <input
        type="text"
        id="nomeReclamacao"
        placeholder="Digite seu nome"
        required
    >

    <button
        type="button"
        class="botao-anonimo"
        onclick="enviarComoAnonimo()"
    >
        Enviar como anônimo
    </button>
</div>

            <label for="intensidade">
                Intensidade da reclamação (1 a 5)
            </label>

            <select id="intensidade" required>
                <option value="">Selecione</option>
                <option value="1">1 - Leve</option>
                <option value="2">2 - Moderada</option>
                <option value="3">3 - Séria</option>
                <option value="4">4 - Muito séria</option>
                <option value="5">5 - ABSURDA</option>
            </select>

            <label for="reclamacao">Sua reclamação</label>

            <textarea id="reclamacao"
                      placeholder="Escreva sua reclamação..."
                      required></textarea>

            <button type="submit">Enviar Reclamação</button>

            <button type="button" onclick="telaInicial()">
                Voltar
            </button>
        </form>
    `;
}

function enviarComoAnonimo() {
    document.getElementById("nomeReclamacao").value = "Arregão(ona)";
}

async function enviarReclamacao(event) {
    event.preventDefault();

    const nome = document.getElementById("nomeReclamacao").value.trim();
    const reclamacao = document.getElementById("reclamacao").value.trim();
    const intensidade = document.getElementById("intensidade").value;

    if (!nome || !reclamacao || !intensidade) {
        alert("Preencha todos os campos antes de enviar!");
        return;
    }

    const botao = event.submitter;
    botao.disabled = true;
    botao.textContent = "Enviando...";

    try {
        await fetch(URL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                nome: nome,
                reclamacao: reclamacao,
                intensidade: intensidade
            })
        });

        alert("Reclamação enviada! Senta lá e godrink.");

        document.getElementById("nomeReclamacao").value = "";
        document.getElementById("reclamacao").value = "";
        document.getElementById("intensidade").value = "";

    } catch (erro) {
        alert("Não foi possível enviar. Tente novamente.");
        console.error(erro);

    } finally {
        botao.disabled = false;
        botao.textContent = "Enviar Reclamação";
    }
}

function telaInicial() {
    const tela = document.getElementById("tela");

    tela.innerHTML = `
        <h1>
            Bem vindo(a) a central de amizade do Lorran. Como podemos te ajudar?
        </h1>

        <div class="botoes">
            <button onclick="tocarSom('Preciso de ajuda! 🧡'); inicio()">
                Preciso de ajuda! 🧡
            </button>

            <button onclick="tocarSom('Enviar carinho 🤍'); mostrarFinal('Então me manda um pix: 15134150699')">
                Enviar carinho 🤍
            </button>

            <button class="botao-reclamacao" onclick="tocarSom('Fazer reclamação 😡'); telaReclamacao()">
                Fazer reclamação 😡
            </button>
        </div>
    `;
}

// INICIA O PROGRAMA
telaInicial();
    </script>

</body>
</html>
